name: iOS CI

on:
  push:
    branches: [ main ]
    paths: [ 'iOS/**', '.github/workflows/ios.yml' ]
  pull_request:
    paths: [ 'iOS/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate

      # 模拟器构建不需要签名，也不需要 Apple 开发者账号
      - name: Build for simulator
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild -project AllClear.xcodeproj \
            -scheme AllClear \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: AllClear-simulator-app
          path: iOS/build/Build/Products/Debug-iphonesimulator/AllClear.app
          if-no-files-found: warn
